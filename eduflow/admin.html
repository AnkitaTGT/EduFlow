<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Flow - Admin Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.svg" alt="Logo">
            <h2>Edu Flow</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#/dashboard" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                Dashboard
            </a>
            <a href="#/students" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Students
            </a>
            <a href="#/courses" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72l5 2.73 5-2.73v3.72z"/></svg>
                Courses
            </a>
            <a href="#/analytics" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Analytics
            </a>
            <a href="#/settings" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="breadcrumb" id="breadcrumb">Admin / Dashboard</div>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="document.documentElement.classList.toggle('dark')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div class="user-profile" id="logout-btn">
                    <div class="avatar">A</div>
                    <div class="user-info">
                        <span class="user-name">Admin</span>
                        <span class="user-role">Administrator</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Page Content -->
        <div class="page-container" id="page-content">
            <!-- Router will inject content here -->
        </div>
    </main>

    <!-- Load Mock Data First -->
    <script src="js/mock-data.js"></script>

    <!-- App Logic -->
    <script type="module">
        import { checkAuth, initAuthUI } from './js/auth.js';
        import { initRouter } from './js/router.js';
        import { getStatusBadge, getRiskBadge, debounce } from './js/utils.js';
        import { VirtualTable } from './js/tables.js';
        import { createBarChart, createLineChart, createDoughnutChart } from './js/charts.js';

        // Ensure user is authorized
        const user = checkAuth();
        if (user && user.role !== 'Admin') window.location.href = 'dashboard.html';
        initAuthUI();

        const data = window.EduFlowData;

        // Dashboard Route
        const renderDashboard = (container) => {
            document.getElementById('breadcrumb').textContent = 'Admin / Dashboard';

            // Calculate stats
            const totalStudents = data.students.length;
            const totalTeachers = data.teachers.length;
            const activeCourses = data.courses.length;
            const avgCompletion = data.courses.length > 0 ? Math.round(data.courses.reduce((acc, c) => acc + c.completionRate, 0) / data.courses.length) : 0;
            const avgAttendance = data.students.length > 0 ? Math.round(data.students.reduce((acc, s) => acc + s.attendancePct, 0) / data.students.length) : 0;
            const atRiskCount = data.students.filter(s => s.riskFlag).length;

            container.innerHTML = `
                <div class="filters-bar" style="margin-bottom: 24px;">
                    <div class="input-group">
                        <select id="dash-filter-class">
                            <option value="">All Classes</option>
                            <option value="Class 10A">Class 10A</option>
                            <option value="Class 10B">Class 10B</option>
                            <option value="Class 11A">Class 11A</option>
                            <option value="Class 11B">Class 11B</option>
                            <option value="Class 12A">Class 12A</option>
                            <option value="Class 12B">Class 12B</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <select id="dash-filter-course">
                            <option value="">All Courses</option>
                            ${data.courses.map(c => `<option value="${c.id}">${c.title}</option>`).join('')}
                        </select>
                    </div>
                    <div class="input-group">
                        <input type="date" id="dash-filter-date-start" title="Start Date">
                        <span style="margin: 0 8px;">to</span>
                        <input type="date" id="dash-filter-date-end" title="End Date">
                    </div>
                    <button class="btn btn-outline" onclick="alert('Demo: Filters applied successfully')">Apply</button>
                </div>
                <div class="grid-cards">
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>Total Students</span>
                            <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
                        </div>
                        <div class="stat-value">${totalStudents}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>Total Teachers</span>
                            <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
                        </div>
                        <div class="stat-value">${totalTeachers}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>Active Courses</span>
                            <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></div>
                        </div>
                        <div class="stat-value">${activeCourses}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>Avg Completion</span>
                            <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg></div>
                        </div>
                        <div class="stat-value">${avgCompletion}%</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>Avg Attendance</span>
                            <div class="stat-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></div>
                        </div>
                        <div class="stat-value">${avgAttendance}%</div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-header">
                            <span>At-Risk Students</span>
                            <div class="stat-icon" style="background: rgba(239, 68, 68, 0.1); color: var(--danger);"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg></div>
                        </div>
                        <div class="stat-value">${atRiskCount}</div>
                    </div>
                </div>

                <div class="grid-charts">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Course Completion Rates</h3></div>
                        <div style="height: 250px;"><canvas id="chart-course-completion"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Weekly Attendance Trend</h3></div>
                        <div style="height: 250px;"><canvas id="chart-attendance-trend"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Assignment Submissions</h3></div>
                        <div style="height: 250px;"><canvas id="chart-assignments"></canvas></div>
                    </div>
                </div>

                <div class="grid-2-cols">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Recent Enrollments</h3></div>
                        <div class="table-container">
                            <table style="min-width: 100%">
                                <thead><tr><th>Student</th><th>Course</th><th>Date</th><th>Status</th></tr></thead>
                                <tbody id="recent-enrollments-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">At-Risk Students</h3></div>
                        <div class="table-container">
                            <table style="min-width: 100%">
                                <thead><tr><th>Name</th><th>Risk Factor</th></tr></thead>
                                <tbody id="at-risk-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            // Draw Charts
            const courseLabels = data.courses.map(c => c.title.substring(0, 15) + '...');
            const courseData = data.courses.map(c => c.completionRate);
            createBarChart('chart-course-completion', courseLabels, courseData, 'Completion Rate %');

            // Attendance Trend
            const weeks = ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7', 'Week 8'];
            const attData = weeks.map(w => {
                const records = data.attendance.filter(a => a.week === w);
                if(records.length === 0) return 0;
                const totalP = records.reduce((sum, r) => sum + r.presentDays, 0);
                const totalD = records.reduce((sum, r) => sum + r.totalDays, 0);
                return Math.round((totalP / totalD) * 100);
            });
            createLineChart('chart-attendance-trend', weeks, [{
                label: 'Avg Attendance %',
                data: attData,
                borderColor: '#10B981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                fill: true,
                tension: 0.4
            }], 'Attendance %');

            // Aggregate assignment data
            let totalSub = 0, totalPend = 0, totalGrad = 0;
            data.assignments.forEach(a => { totalSub += a.totalSubmissions; totalPend += a.pending; totalGrad += a.graded; });
            createDoughnutChart('chart-assignments', ['Submitted', 'Pending', 'Graded'], [totalSub, totalPend, totalGrad]);

            // Populate Tables
            const recent = [...data.enrollments].sort((a,b) => new Date(b.startDate) - new Date(a.startDate)).slice(0, 5);
            const rTbody = document.getElementById('recent-enrollments-tbody');
            recent.forEach(e => {
                const s = data.students.find(st => st.id === e.studentId);
                const c = data.courses.find(co => co.id === e.courseId);
                rTbody.innerHTML += `<tr><td>${s?s.name:'Unknown'}</td><td>${c?c.title:'Unknown'}</td><td>${e.startDate}</td><td>${getStatusBadge(e.status)}</td></tr>`;
            });

            const risks = data.students.filter(s => s.riskFlag).slice(0, 5);
            const riskTbody = document.getElementById('at-risk-tbody');
            risks.forEach(s => {
                riskTbody.innerHTML += `<tr><td>${s.name}</td><td>${getRiskBadge(true)}</td></tr>`;
            });
        };

        // --- Pages placeholders for router ---
        // These will be fully implemented in subsequent files and fetch their HTML via fetch or just be registered here.
        // For static simplicity, we map routes to generic implementations or load external HTML snippets if possible.
        // Since no server, we inject template literal based views.

        const fetchPageContent = async (url) => {
            try {
                const response = await fetch(url);
                return await response.text();
            } catch(e) {
                return `<div class="empty-state">Error loading page</div>`;
            }
        };

        const renderPage = async (container, pageUrl, initScriptFn) => {
            container.innerHTML = await fetchPageContent(pageUrl);
            if(initScriptFn) initScriptFn();
        };

        // Router Configuration
        import { views } from './js/views.js';

        const routes = {
            '/dashboard': renderDashboard,
            '/students': views.students,
            '/courses': views.courses,
            '/analytics': views.analytics,
            '/settings': views.settings
        };

        initRouter(routes, '/dashboard');

        // Expose functions globally for dynamically loaded scripts
        window.VirtualTable = VirtualTable;
        window.getStatusBadge = getStatusBadge;
        window.getRiskBadge = getRiskBadge;
        window.debounce = debounce;
        window.createBarChart = createBarChart;
        window.createLineChart = createLineChart;

    </script>
</body>
</html>
