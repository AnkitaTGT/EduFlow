<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Flow - Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-primary);
        }
        .login-container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
        }
        h1 { margin-bottom: 8px; }
        p.tagline { color: var(--text-muted); margin-bottom: 32px; }
        .error-msg { color: var(--danger); margin-bottom: 16px; display: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="assets/logo.svg" alt="Edu Flow Logo" style="width: 100%; height: 100%;">
        </div>
        <h1>Edu Flow</h1>
        <p class="tagline">Track. Learn. Grow.</p>

        <div id="error-msg" class="error-msg">Invalid credentials.</div>

        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label for="role-select">Select Demo Role</label>
                <select id="role-select" class="form-control" onchange="fillCredentials()">
                    <option value="">-- Select Role --</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Sign In</button>
        </form>
        <p style="margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
            Demo Application - Data is mocked in browser storage.
        </p>
    </div>

    <script type="module">
        import { login, checkAuth } from './js/auth.js';

        // Redirect if already logged in
        if (sessionStorage.getItem('eduflow_user')) {
             window.location.href = 'dashboard.html';
        }

        window.fillCredentials = function() {
            const role = document.getElementById('role-select').value;
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            if (role === 'admin') {
                emailInput.value = 'admin@eduflow.com';
                passInput.value = 'admin123';
            } else if (role === 'teacher') {
                emailInput.value = 'teacher@eduflow.com';
                passInput.value = 'teach123';
            } else if (role === 'student') {
                emailInput.value = 'student@eduflow.com';
                passInput.value = 'study123';
            } else {
                emailInput.value = '';
                passInput.value = '';
            }
        };

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (login(email, password)) {
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
