<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Flow - Teacher Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="assets/logo.svg" alt="Logo">
            <h2>Edu Flow</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#/dashboard" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
            </a>
            <a href="#/my-students" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> My Students
            </a>
            <a href="#/my-courses" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72l5 2.73 5-2.73v3.72z"/></svg> My Courses
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="breadcrumb" id="breadcrumb">Teacher / Dashboard</div>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="document.documentElement.classList.toggle('dark')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <div class="user-profile" id="logout-btn">
                    <div class="avatar">T</div>
                    <div class="user-info">
                        <span class="user-name">Teacher</span>
                        <span class="user-role">Teacher</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-container" id="page-content"></div>
    </main>

    <script src="js/mock-data.js"></script>
    <script type="module">
        import { checkAuth, initAuthUI } from './js/auth.js';
        import { initRouter } from './js/router.js';
        import { getStatusBadge, getProgressBar } from './js/utils.js';
        import { createBarChart } from './js/charts.js';

        const user = checkAuth();
        if (user && user.role !== 'Teacher') window.location.href = 'dashboard.html';
        initAuthUI();

        const data = window.EduFlowData;
        const teacherId = user.userId;

        const renderDashboard = (container) => {
            const myCourses = data.courses.filter(c => c.teacherId === teacherId);
            const myCourseIds = myCourses.map(c => c.id);
            const myEnrollments = data.enrollments.filter(e => myCourseIds.includes(e.courseId));
            const uniqueStudents = new Set(myEnrollments.map(e => e.studentId));

            const avgProgress = myEnrollments.length ? Math.round(myEnrollments.reduce((a,e) => a+e.progress, 0) / myEnrollments.length) : 0;

            let mySubmissions = 0;
            data.assignments.filter(a => myCourseIds.includes(a.courseId)).forEach(a => mySubmissions += a.totalSubmissions);

            const needsAttention = [];
            Array.from(uniqueStudents).forEach(sId => {
                const s = data.students.find(st => st.id === sId);
                const qResults = data.quizResults.filter(q => q.studentId === sId);
                const avgQ = qResults.length ? qResults.reduce((a,q)=>a+q.score,0)/qResults.length : 100;
                if(s && (s.attendancePct < 70 || avgQ < 50)) {
                    needsAttention.push({...s, quizAvg: Math.round(avgQ)});
                }
            });

            container.innerHTML = `
                <div class="grid-cards">
                    <div class="card stat-card"><div class="stat-header"><span>My Students</span></div><div class="stat-value">${uniqueStudents.size}</div></div>
                    <div class="card stat-card"><div class="stat-header"><span>My Courses</span></div><div class="stat-value">${myCourses.length}</div></div>
                    <div class="card stat-card"><div class="stat-header"><span>Avg Class Progress</span></div><div class="stat-value">${avgProgress}%</div></div>
                    <div class="card stat-card"><div class="stat-header"><span>Submissions</span></div><div class="stat-value">${mySubmissions}</div></div>
                </div>

                <div class="grid-charts">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Quiz Average Scores</h3></div>
                        <div style="height: 250px;"><canvas id="teacher-quiz-chart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Class Attendance Trend</h3></div>
                        <div style="height: 250px;"><canvas id="teacher-att-chart"></canvas></div>
                    </div>
                </div>

                <div class="grid-2-cols">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Upcoming Tasks</h3></div>
                        <div>
                            ${data.assignments.filter(a => myCourseIds.includes(a.courseId) && new Date(a.dueDate) > new Date()).slice(0, 5).map(a => `
                                <div style="display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border);">
                                    <div><strong>${a.title}</strong><br><small class="text-muted">Due: ${a.dueDate}</small></div>
                                    <span class="badge badge-warning">Pending</span>
                                </div>
                            `).join('') || '<p class="text-muted">No upcoming tasks.</p>'}
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">Students Needing Attention</h3></div>
                        <div>
                            ${needsAttention.slice(0,5).map(s => `
                                <div style="display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border);">
                                    <div><strong>${s.name}</strong><br><small class="text-muted">Attendance: ${s.attendancePct}% | Quiz Avg: ${s.quizAvg}%</small></div>
                                    ${getStatusBadge('At Risk')}
                                </div>
                            `).join('') || '<p class="text-muted">All students are on track!</p>'}
                        </div>
                    </div>
                </div>
            `;

            // Draw Charts
            const myQuizzes = data.quizzes.filter(q => myCourseIds.includes(q.courseId));
            if(myQuizzes.length > 0) {
                window.createBarChart('teacher-quiz-chart', myQuizzes.map(q=>q.title.substring(0,10)+'...'), myQuizzes.map(q=>q.avgScore), 'Avg Score', '#F59E0B');
            }

            const weeks = ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7', 'Week 8'];
            const attData = weeks.map(w => {
                const records = data.attendance.filter(a => myCourseIds.includes(a.courseId) && a.week === w);
                if(records.length === 0) return 0;
                return Math.round((records.reduce((sum, r) => sum + r.presentDays, 0) / records.reduce((sum, r) => sum + r.totalDays, 0)) * 100);
            });
            window.createLineChart('teacher-att-chart', weeks, [{
                label: 'Avg Class Attendance %',
                data: attData,
                borderColor: '#10B981',
                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                fill: true,
                tension: 0.4
            }]);
        };

        import { views } from './js/views.js';

        const routes = {
            '/dashboard': renderDashboard,
            '/my-students': {
                html: views.students.html,
                init: (data) => views.students.init(data, teacherId)
            },
            '/my-courses': {
                html: views.courses.html,
                init: (data) => views.courses.init(data, teacherId)
            }
        };

        initRouter(routes, '/dashboard');
    </script>
</body>
</html>
